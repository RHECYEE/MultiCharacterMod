buildscript {
    repositories {
        mavenCentral()
        // Use the legacy files server which has the old userdev jars
        maven { url = 'https://files.minecraftforge.net/maven' }
        maven { url = 'https://repo.spongepowered.org/maven' }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = "1.0"
group = "studio.ERM"
archivesBaseName = "HomoSapiens"

sourceCompatibility = targetCompatibility = '1.8'

minecraft {
    // Using a known-working version with available userdev files
    version = "1.12.2-14.23.5.2847"
    runDir = "run"
    mappings = "stable_39"
}

repositories {
    mavenCentral()
    // Use the legacy files server
    maven { url = 'https://files.minecraftforge.net/maven' }
    maven { url = 'https://repo.spongepowered.org/maven' }
    flatDir { dirs 'libs' }
}

dependencies {
    // Automatically includes Ancient Warfare 2 and Flan's Mod from your libs folder
    compile fileTree(dir: 'libs', include: ['*.jar'])
}

// Fix for Java 8 compatibility issues
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
jar {
    manifest {
        attributes([
                "Specification-Title": "HomoSapiens",
                "Implementation-Title": "HomoSapiens",
                "Implementation-Version": "${version}",
                "FMLAT": "mpm_at.cfg" // This must match your filename exactly
        ])
    }
}